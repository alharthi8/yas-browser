[package]
name = "yas-macos"
version = "0.4.7"
edition = "2021"

[dependencies]
wry = "=0.57.1"
tao = "=0.37.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
directories = "6"
rfd = "0.15"
semver = "1"
self_update = { version = "=1.3.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-zip", "compression-zip-deflate", "signatures", "checksums"] }

[profile.release]
opt-level = 2
strip = true
